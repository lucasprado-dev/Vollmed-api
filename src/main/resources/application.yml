spring:
  application:
    name: api

  jackson:
    mapper:
      accept-case-insensitive-enums: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost/vollmed_api}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  web:
    error:
      include-stacktrace: never
      include-message: never

